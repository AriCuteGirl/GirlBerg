name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install premake5
        run: |
          curl -sL https://github.com/premake/premake-core/releases/download/v5.0.0-beta5/premake-5.0.0-beta5-windows.zip -o premake.zip
          7z x premake.zip -opremake-bin
          echo "$PWD/premake-bin" >> $env:GITHUB_PATH

      - name: Generate project files
        run: premake5 vs2022

      - name: Build (Release)
        run: |
          msbuild build/project/vs2022/x86_64/Goldberg-Emulator.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Build (Debug)
        run: |
          msbuild build/project/vs2022/x86_64/Goldberg-Emulator.sln /p:Configuration=Debug /p:Platform=x64 /m

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GirlBerg-x64
          path: build/bin/**/*.dll
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
