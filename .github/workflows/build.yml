name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DEPS_DIR: third-party\deps\win

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Clone third-party deps (win)
        uses: actions/checkout@v4
        with:
          repository: Detanup01/gbe_fork
          ref: third-party/deps/win
          path: third-party/deps/win

      - name: Generate project files
        shell: cmd
        run: |
          "third-party\deps\win\common\win\premake\premake5.exe" --file=premake5.lua --genproto --dosstub --winrsrc --os=windows vs2022

      - name: Build Release x64
        shell: cmd
        run: |
          msbuild build\project\vs2022\x86_64\Goldberg-Emulator.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Build Debug x64
        shell: cmd
        run: |
          msbuild build\project\vs2022\x86_64\Goldberg-Emulator.sln /p:Configuration=Debug /p:Platform=x64 /m

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GirlBerg-x64
          path: build\bin\**
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
