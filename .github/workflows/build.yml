name: Build Windows

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download third-party deps
        shell: cmd
        run: |
          mkdir third-party\deps\win
          curl -sL "https://github.com/Detanup01/gbe_fork/releases/download/third-party_deps_win/deps_win.7z" -o deps.7z
          7z x deps.7z -othird-party\deps\win -y

      - name: Generate project files
        shell: cmd
        run: |
          third-party\deps\win\common\win\premake\premake5.exe --file=premake5.lua --genproto --dosstub --winrsrc --os=windows vs2022

      - name: Build (Release x64)
        shell: cmd
        run: |
          msbuild build\project\vs2022\x86_64\Goldberg-Emulator.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Build (Debug x64)
        shell: cmd
        run: |
          msbuild build\project\vs2022\x86_64\Goldberg-Emulator.sln /p:Configuration=Debug /p:Platform=x64 /m

      - name: List artifacts
        shell: cmd
        run: |
          dir /s /b build\bin\*.dll build\bin\*.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GirlBerg-x64
          path: build/bin/**/*
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
