name: Get Latest Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest gbe_fork release
        id: latest
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: Detanup01/gbe_fork
          excludes: prerelease

      - name: Download release
        run: |
          TAG="${{ steps.latest.outputs.release }}"
          echo "Downloading from tag: $TAG"
          curl -sL "https://github.com/Detanup01/gbe_fork/releases/download/$TAG/emu-win-release.7z" -o /tmp/emu-win-release.7z

      - name: Extract DLLs
        run: |
          7z x /tmp/emu-win-release.7z -o/tmp/output -y
          find /tmp/output -type f \( -name "*.dll" -o -name "*.exe" \) | sort

      - name: Create package
        run: |
          cd /tmp/output && 7z a /tmp/GirlBerg-x64.7z * -r

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/GirlBerg-x64.7z
          token: ${{ secrets.GITHUB_TOKEN }}
